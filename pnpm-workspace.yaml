packages:
  # Public & user-facing applications
  - "apps/*"
  - "pulse-connect-ui(has a unified universal user dashboard)"
  # Core user interfaces
  - "pulse-connect-ui"
  - "pulse-connect-admin-ui"
  - "pulse-connect-admin-ui/apps/*"      # Include all admin dashboards in unified workspace
  - "pulse-connect-admin-ui/packages/*"   # Include nested packages like admin-admin-lifecycle

  # Core platform engine
  - "pulse-connect-core"

  # Backend services & gateways
  - "services/*"
  - "pulse-hosting-backend"

  # Shared internal libraries
  - "packages/*"
  - "shared/*"

  # Domain-specific modules (if/when added)
  - "modules/*"
  - "integrations/*"
  #intelligence 
  - "intelligence/*"

  # Infrastructure & deployment
  - "infrastructure/*"
  - "deployments/*"