version: "3.9"

services:
  web:
    build: .
    container_name: pulsco_app
    working_dir: /app
    volumes:
      - ./pulsco:/app
    command: ./entrypoint.sh
    expose:
      - "8000"
    depends_on:
      - db
      - redis
    env_file:
      - .env.local
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

  celery_worker:
    build: .
    container_name: pulsco_worker
    working_dir: /app
    volumes:
      - ./pulsco:/app
    command: celery -A pulsco worker -l info
    depends_on:
      - db
      - redis
    env_file:
      - .env.local
    restart: always

  celery_beat:
    build: .
    container_name: pulsco_beat
    working_dir: /app
    volumes:
      - ./pulsco:/app
    command: celery -A pulsco beat -l info
    depends_on:
      - db
      - redis
    env_file:
      - .env.local
    restart: always

  db:
    image: postgis/postgis:15-3.4
    container_name: pulsco_db
    env_file:
      - .env.local
    volumes:
      - db_data:/var/lib/postgresql/data
      - .:/app
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsco -d pulsco"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: pulsco_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
    restart: always

  nginx:
    image: nginx:latest
    container_name: pulsco_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./pulsco/staticfiles:/var/www/staticfiles
    depends_on:
      - web
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  db_data:
