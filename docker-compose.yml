version: "3.9"

services:
  web:
    build: .
    container_name: pulsco_app
    working_dir: /app
    volumes:
      - ./pulsco:/app   # Mount the pulsco subfolder where manage.py lives
    command: ./entrypoint.sh
    expose:
      - "8000"
    depends_on:
      - db
    environment:
      DJANGO_SETTINGS_MODULE: pulsco.settings
      DATABASE_URL: postgres://pulsco:password@db:5432/pulsco
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgis/postgis:15-3.4   # Postgres 15 with PostGIS preinstalled
    container_name: pulsco_db
    environment:
      POSTGRES_USER: pulsco
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pulsco
    volumes:
      - db_data:/var/lib/postgresql/data
      - .:/app   # Mount your whole project root so SQL files are visible
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsco -d pulsco"]
      interval: 30s
      timeout: 10s
      retries: 5

  nginx:
    image: nginx:latest
    container_name: pulsco_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/static
    depends_on:
      - web
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  db_data:
