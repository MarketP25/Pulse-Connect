version: "3.9"

services:
  web:
    build: .
    container_name: pulsco_app
    working_dir: /app
    command: >
      sh -c "python manage.py migrate &&
             gunicorn pulsco.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
    expose:
      - "8000"
    depends_on:
      - db
    environment:
      DJANGO_SETTINGS_MODULE: pulsco.settings
      DATABASE_URL: postgres://pulsco:password@db:5432/pulsco
      # Django connects to db:5432 inside Docker

  db:
    image: postgres:15
    container_name: pulsco_db
    environment:
      POSTGRES_USER: pulsco
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pulsco
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"   # host:container mapping, avoids conflict with other Postgres

  nginx:
    image: nginx:latest
    container_name: pulsco_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/static
    depends_on:
      - web

volumes:
  db_data:
