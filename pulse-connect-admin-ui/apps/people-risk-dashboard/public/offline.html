<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="theme-color" content="#7c3aed" />
    <title>Pulsco - Offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        background: radial-gradient(1200px 600px at 20% 20%, #7c3aed22, transparent),
          radial-gradient(900px 500px at 80% 30%, #0ea5e922, transparent),
          linear-gradient(135deg, #0f172a, #2e1065);
        color: #e2e8f0;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(680px, 100%);
        background: #0b1220cc;
        border: 1px solid #7c3aed55;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      }
      h1 {
        font-size: 22px;
        margin: 0 0 8px 0;
      }
      p {
        margin: 0 0 16px 0;
        line-height: 1.5;
        color: #cbd5e1;
      }
      .meta {
        display: grid;
        gap: 8px;
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px solid #334155;
        font-size: 13px;
        color: #94a3b8;
      }
      .actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 18px;
      }
      a.button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 14px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 600;
        border: 1px solid #7c3aed88;
        background: #7c3aed22;
        color: #ffffff;
      }
      a.button.secondary {
        border-color: #334155;
        background: #0f172a;
        color: #e2e8f0;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace;
        font-size: 12px;
        background: #0f172a;
        border: 1px solid #334155;
        padding: 2px 6px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <main class="card" role="main" aria-label="Offline">
      <h1>You're offline.</h1>
      <p>
        Pulsco is unavailable without a network connection. We don't simulate financial/admin actions offline.
        Reconnect to continue.
      </p>
      <div class="actions">
        <a class="button" href="/">Retry</a>
        <a class="button secondary" href="/">Reload</a>
      </div>
      <div class="meta">
        <div>Tip: If this keeps happening, check your Wi-Fi/cellular network.</div>
        <div>Safe mode: <code>network-only</code> for sensitive routes.</div>
      </div>
    </main>
  </body>
</html>
