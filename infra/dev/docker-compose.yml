version: '3.8'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ../db-migrations:/migrations:ro
      - db_data:/var/lib/postgresql/data

  unified-gateway:
    image: nginx:1.27-alpine
    profiles: ["gateway"]
    ports:
      - "8080:80"
    volumes:
      - ../gateway/nginx/pulsco-unified-origin.local.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  db_data:
    driver: local
