# Local unified-origin gateway for development (HTTP only)
# Usage:
#   docker compose -f infra/dev/docker-compose.yml --profile gateway up -d unified-gateway
#   open http://localhost:8080
#
# Expected local app ports:
#   pulse-portal:               3000
#   pulse-connect-ui:           3002
#   pulse-connect-admin-ui:     3003
#   edge-gateway:               3001
#   marp-firewall-gateway:      3004

upstream pulse_portal_local {
  server host.docker.internal:3000;
}
upstream pulse_connect_ui_local {
  server host.docker.internal:3002;
}
upstream pulse_connect_admin_ui_local {
  server host.docker.internal:3003;
}
upstream edge_gateway_local {
  server host.docker.internal:3001;
}
upstream marp_firewall_local {
  server host.docker.internal:3004;
}

server {
  listen 80;
  server_name localhost;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_http_version 1.1;

  location ^~ /billing/ { proxy_pass http://edge_gateway_local; }
  location ^~ /wallet/ { proxy_pass http://edge_gateway_local; }
  location ^~ /auth/ { proxy_pass http://edge_gateway_local; }
  location ^~ /edge/ { proxy_pass http://edge_gateway_local; }
  location ^~ /marp/ { proxy_pass http://marp_firewall_local; }

  location ^~ /admin/ { proxy_pass http://pulse_connect_admin_ui_local; }
  location ^~ /connect/ { proxy_pass http://pulse_connect_ui_local; }
  location / { proxy_pass http://pulse_portal_local; }
}
