# Pulsco Unified-Origin Gateway (single deployable ecosystem)
# Canonical origin: https://pulsco.global
#
# Route contract:
#   /                         -> pulse-portal
#   /connect/*                -> pulse-connect-ui
#   /admin/*                  -> pulse-connect-admin-ui + governed admin dashboards
#   /billing|/wallet|/auth/*  -> edge-gateway (governed only)
#   /edge/*                   -> edge-gateway
#   /marp/*                   -> marp-firewall-gateway

upstream pulse_portal {
  server pulse-portal:3000;
}

upstream pulse_connect_ui {
  server pulse-connect-ui:3000;
}

upstream pulse_connect_admin_ui {
  server pulse-connect-admin-ui:3000;
}

upstream business_ops_dashboard {
  server business-ops-dashboard:3000;
}

upstream commercial_dashboard {
  server commercial-dashboard:3000;
}

upstream coo_dashboard {
  server coo-dashboard:3000;
}

upstream customer_experience_dashboard {
  server customer-experience-dashboard:3000;
}

upstream governance_registrar_dashboard {
  server governance-registrar-dashboard:3000;
}

upstream legal_finance_dashboard {
  server legal-finance-dashboard:3000;
}

upstream people_risk_dashboard {
  server people-risk-dashboard:3000;
}

upstream procurement_dashboard {
  server procurement-dashboard:3000;
}

upstream superadmin_dashboard {
  server superadmin-dashboard:3000;
}

upstream tech_security_dashboard {
  server tech-security-dashboard:3000;
}

upstream edge_gateway {
  server edge-gateway-service:80;
}

upstream marp_firewall_gateway {
  server marp-firewall-gateway:8080;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name pulsco.com www.pulsco.com;
  return 308 https://pulsco.com$request_uri;
}

server {
  listen 443 ssl http2;
  server_name pulsco.com;

  # TLS certs are provisioned by cert-manager / ingress controller.
  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

  client_max_body_size 10m;

  # Shared proxy settings
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_http_version 1.1;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;

  # ---------------------------------------------
  # Governed sensitive routes (no direct app bypass)
  # ---------------------------------------------
  location ^~ /billing/ {
    proxy_pass http://edge_gateway;
  }

  location ^~ /wallet/ {
    proxy_pass http://edge_gateway;
  }

  location ^~ /auth/ {
    proxy_pass http://edge_gateway;
  }

  location ^~ /edge/ {
    proxy_pass http://edge_gateway;
  }

  location ^~ /marp/ {
    proxy_pass http://marp_firewall_gateway;
  }

  # ---------------------------------------------
  # Admin dashboards under one canonical /admin origin
  # ---------------------------------------------
  location ^~ /admin/business-ops/ {
    proxy_pass http://business_ops_dashboard;
  }

  location ^~ /admin/commercial/ {
    proxy_pass http://commercial_dashboard;
  }

  location ^~ /admin/coo/ {
    proxy_pass http://coo_dashboard;
  }

  location ^~ /admin/customer-experience/ {
    proxy_pass http://customer_experience_dashboard;
  }

  location ^~ /admin/governance-registrar/ {
    proxy_pass http://governance_registrar_dashboard;
  }

  location ^~ /admin/legal-finance/ {
    proxy_pass http://legal_finance_dashboard;
  }

  location ^~ /admin/people-risk/ {
    proxy_pass http://people_risk_dashboard;
  }

  location ^~ /admin/procurement/ {
    proxy_pass http://procurement_dashboard;
  }

  location ^~ /admin/superadmin/ {
    proxy_pass http://superadmin_dashboard;
  }

  location ^~ /admin/tech-security/ {
    proxy_pass http://tech_security_dashboard;
  }

  location ^~ /admin/ {
    proxy_pass http://pulse_connect_admin_ui;
  }

  # ---------------------------------------------
  # Public UI routes
  # ---------------------------------------------
  location ^~ /connect/ {
    proxy_pass http://pulse_connect_ui;
  }

  location / {
    proxy_pass http://pulse_portal;
  }
}

# Optional hard redirects to prevent independent app origins:
#
# server {
#   listen 443 ssl http2;
#   server_name connect.pulsco.com;
#   return 308 https://pulsco.com/connect$request_uri;
# }
#
# server {
#   listen 443 ssl http2;
#   server_name admin.pulsco.com;
#   return 308 https://pulsco.com/admin$request_uri;
# }
